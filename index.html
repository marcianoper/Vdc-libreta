<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Libreta Digital VDC360 V2</title>
<style>
:root{
  --paper:#fbf4df;
  --paper-2:#fff9e9;
  --ink:#2b2417;
  --muted:#7d6f55;
  --line:rgba(80,65,35,.25);
  --strong:#3b2d18;
  --soft:#efe2bd;
  --green:#315f42;
  --red:#8b3434;
  --blue:#315575;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#dccb9e}
body{padding:14px}
.app{max-width:1280px;margin:0 auto;background:var(--paper);border:2px solid #6f5c35;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden}
.header{padding:14px 18px 10px;background:linear-gradient(180deg,var(--paper-2),var(--paper));border-bottom:2px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:26px;letter-spacing:.5px;margin:0;font-weight:900}.dateBox{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.dateBox input{font-size:17px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 8px;color:var(--ink);font-weight:800}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tool{border:1px solid var(--line);background:rgba(255,255,255,.25);border-radius:9px;padding:7px 9px;font-size:15px;cursor:pointer;color:var(--ink)}.tool:active{transform:scale(.97)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.card{border:1px solid var(--line);background:rgba(255,255,255,.22);border-radius:12px;padding:10px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.5px}.value{font-size:22px;font-weight:900;margin-top:4px}.saldo input{width:100%;font-size:22px;font-weight:900;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);outline:none;padding:2px}
.notebook{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}.col{min-height:620px;border-right:2px solid var(--line);display:flex;flex-direction:column}.col:last-child{border-right:0}.colHead{padding:12px 14px;text-align:center;font-size:22px;font-weight:900;border-bottom:2px solid var(--line);letter-spacing:.8px}.entradas .colHead{color:var(--green)}.gastos .colHead{color:var(--red)}.ingresos .colHead{color:var(--blue)}
.subhead{display:grid;grid-template-columns:1.5fr .75fr 42px;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase}.rows{flex:1;background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 41px, rgba(80,65,35,.18) 42px);padding:0 8px 8px}.row{display:grid;grid-template-columns:1.5fr .75fr 42px;gap:8px;align-items:center;min-height:42px;padding:4px;border-bottom:1px solid rgba(80,65,35,.13)}.row .name{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .num{text-align:right;font-size:18px;font-weight:900}.row button{border:0;background:transparent;font-size:18px;cursor:pointer;color:#9b2f2f}.empty{height:42px;color:rgba(0,0,0,.25);font-size:15px;display:flex;align-items:center;padding-left:8px}.total{border-top:2px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:900}.addBtn{margin:10px 14px 14px;border:2px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.18);font-size:26px;font-weight:900;padding:10px;cursor:pointer;color:var(--strong)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{width:min(420px,100%);background:var(--paper-2);border:2px solid #6f5c35;border-radius:16px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.box h2{margin:0 0 14px;font-size:24px}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.field input{width:100%;font-size:24px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf4;color:var(--ink);outline:none}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.actions button{font-size:18px;font-weight:900;border-radius:12px;padding:11px 16px;border:1px solid var(--line);cursor:pointer}.save{background:var(--strong);color:white}.cancel{background:transparent;color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 8px;background:rgba(255,255,255,.35);cursor:pointer}
@media(max-width:900px){body{padding:6px}.summary{grid-template-columns:1fr 1fr}.notebook{grid-template-columns:1fr}.col{border-right:0;border-bottom:2px solid var(--line);min-height:430px}h1{font-size:21px}.value,.saldo input{font-size:19px}.row .name,.row .num{font-size:17px}}
@media print{body{background:white;padding:0}.app{box-shadow:none;border:0;border-radius:0}.tools,.addBtn,.row button{display:none}.col{min-height:560px}.header{break-inside:avoid}.notebook{grid-template-columns:1fr 1fr 1fr}.col{border-right:2px solid var(--line);border-bottom:0}.modal{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="topbar">
      <h1>LIBRETA DIGITAL VDC360</h1>
      <div class="dateBox">📅 <input type="date" id="fecha"></div>
      <div class="tools">
        <button class="tool" onclick="window.print()" title="Imprimir">🖨️</button>
        <button class="tool" onclick="exportarCSV()" title="Exportar CSV">📄</button>
        <button class="tool" onclick="mandarWhatsApp()" title="WhatsApp">📱</button>
        <button class="tool" onclick="limpiarDia()" title="Limpiar día">🧹</button>
      </div>
    </div>
    <div class="summary">
      <div class="card saldo"><div class="label">Saldo inicial</div><input id="saldoInicial" type="number" step="0.01" value="0"></div>
      <div class="card"><div class="label">Entradas</div><div class="value" id="totalEntradas">0.00 kg</div></div>
      <div class="card"><div class="label">Ingresos</div><div class="value" id="totalIngresos">$0.00</div></div>
      <div class="card"><div class="label">Gastos</div><div class="value" id="totalGastos">$0.00</div></div>
      <div class="card"><div class="label">Saldo actual</div><div class="value" id="saldoActual">$0.00</div></div>
    </div>
  </div>
  <div class="notebook">
    <section class="col entradas">
      <div class="colHead">ENTRADAS</div><div class="subhead"><span>Producto</span><span>Kg</span><span></span></div><div class="rows" id="entradasRows"></div><div class="total"><span>Total kg</span><span id="entradasTotalPie">0.00</span></div><button class="addBtn" onclick="abrirModal('entrada')">＋</button>
    </section>
    <section class="col gastos">
      <div class="colHead">GASTOS</div><div class="subhead"><span>Concepto</span><span>Monto</span><span></span></div><div class="rows" id="gastosRows"></div><div class="total"><span>Total</span><span id="gastosTotalPie">$0.00</span></div><button class="addBtn" onclick="abrirModal('gasto')">＋</button>
    </section>
    <section class="col ingresos">
      <div class="colHead">INGRESOS</div><div class="subhead"><span>Concepto</span><span>Monto</span><span></span></div><div class="rows" id="ingresosRows"></div><div class="total"><span>Total</span><span id="ingresosTotalPie">$0.00</span></div><button class="addBtn" onclick="abrirModal('ingreso')">＋</button>
    </section>
  </div>
</div>

<div class="modal" id="modal" onclick="cerrarSiFondo(event)">
  <div class="box">
    <h2 id="modalTitle">Agregar</h2>
    <div class="field"><label id="labelNombre">Concepto</label><input id="nombre" list="sugerencias" autocomplete="off"></div>
    <datalist id="sugerencias"></datalist>
    <div class="quick" id="chips"></div>
    <div class="field"><label id="labelValor">Monto</label><input id="valor" type="number" step="0.01" inputmode="numeric" pattern="[0-9]*"></div>
    <div class="actions"><button class="cancel" onclick="cerrarModal()">Cancelar</button><button class="save" onclick="guardarMovimiento()">Guardar</button></div>
  </div>
</div>
<script>
const productos = ['Azul','Hueso','Pulpas','Recorte','Chamorro','Plomo','Libro','Cuero','Menudo','Panza','Pata','Tripa','Bofe','Corazón','Lengua','Cachete','Cuajo'];
const conceptos = ['Abonos','Sueldos','Oscar','Pablo','Vinagre','Medicamento','Almuerzo','Cloro Jabón','Refacción','Esparte Pastor','Gasolina','Casetas','Flete','Depósito','Transferencia','Efectivo','Cliente','Pago proveedor'];
let data = {saldoInicial:0, entradas:[], gastos:[], ingresos:[]};
let tipoActual = 'entrada';
let editando = null;
const $ = id => document.getElementById(id);
function hoy(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function key(){ return 'libreta_vdc360_v2_' + $('fecha').value; }
function money(n){ return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}); }
function num(n){ return Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function cargar(){ const raw=localStorage.getItem(key()); data = raw ? JSON.parse(raw) : {saldoInicial:0, entradas:[], gastos:[], ingresos:[]}; $('saldoInicial').value=data.saldoInicial||0; render(); }
function guardar(){ data.saldoInicial = Number($('saldoInicial').value||0); localStorage.setItem(key(), JSON.stringify(data)); render(); }
function renderLista(tipo, id){ const cont=$(id); cont.innerHTML=''; const arr=data[tipo]; if(!arr.length){ cont.innerHTML='<div class="empty">Toca ＋ para agregar</div>'; return; } arr.forEach((x,i)=>{ const row=document.createElement('div'); row.className='row'; row.onclick=(e)=>{ if(e.target.tagName==='BUTTON')return; abrirModal(tipo.slice(0,-1), i); }; row.innerHTML=`<div class="name">${escapeHtml(x.nombre)}</div><div class="num">${tipo==='entradas'?num(x.valor):money(x.valor)}</div><button onclick="borrar('${tipo}',${i})">×</button>`; cont.appendChild(row); }); }

function normalizarTexto(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esEntradaAzul(){ return tipoActual==='entrada' && normalizarTexto($('nombre').value)==='azul'; }
function aplicarPesoAzul(){ if(esEntradaAzul()){ $('valor').value='27.22'; } }
function seleccionarNombre(nombre){ $('nombre').value=nombre; aplicarPesoAzul(); }
function render(){ renderLista('entradas','entradasRows'); renderLista('gastos','gastosRows'); renderLista('ingresos','ingresosRows'); const te=data.entradas.reduce((a,b)=>a+Number(b.valor||0),0); const tg=data.gastos.reduce((a,b)=>a+Number(b.valor||0),0); const ti=data.ingresos.reduce((a,b)=>a+Number(b.valor||0),0); $('totalEntradas').textContent=num(te)+' kg'; $('entradasTotalPie').textContent=num(te); $('totalGastos').textContent=money(tg); $('gastosTotalPie').textContent=money(tg); $('totalIngresos').textContent=money(ti); $('ingresosTotalPie').textContent=money(ti); $('saldoActual').textContent=money(Number(data.saldoInicial||0)+ti-tg); }
function abrirModal(tipo, index=null){
  tipoActual=tipo;
  editando=index;
  const esEntrada=tipo==='entrada';
  $('modalTitle').textContent=(index===null?'Agregar ':'Editar ')+(esEntrada?'Entrada':tipo==='gasto'?'Gasto':'Ingreso');
  $('labelNombre').textContent=esEntrada?'Producto':'Concepto';
  $('labelValor').textContent=esEntrada?'Kg':'Monto';
  const lista=esEntrada?productos:conceptos;
  $('sugerencias').innerHTML=lista.map(x=>`<option value="${escapeHtml(x)}">`).join('');
  $('chips').innerHTML=lista.slice(0,10).map(x=>`<button class="chip" type="button" data-nombre="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>seleccionarNombre(btn.dataset.nombre)));
  let item=null;
  if(index!==null){
    const k=tipo==='entrada'?'entradas':tipo==='gasto'?'gastos':'ingresos';
    item=data[k][index];
  }
  $('nombre').value=item?item.nombre:'';
  $('valor').value=item?item.valor:'';
  $('modal').classList.add('show');
}
function cerrarModal(){ $('modal').classList.remove('show'); editando=null; }
function cerrarSiFondo(e){ if(e.target.id==='modal') cerrarModal(); }
function guardarMovimiento(){ const nombre=$('nombre').value.trim(); const valor=Number($('valor').value||0); if(!nombre || !valor){ alert('Falta llenar los datos.'); return; } const k=tipoActual==='entrada'?'entradas':tipoActual==='gasto'?'gastos':'ingresos'; const obj={nombre,valor}; if(editando!==null) data[k][editando]=obj; else data[k].push(obj); guardar(); cerrarModal(); }
function borrar(tipo,i){ if(confirm('¿Eliminar este renglón?')){ data[tipo].splice(i,1); guardar(); } }
function limpiarDia(){ if(confirm('¿Borrar toda la libreta de este día?')){ localStorage.removeItem(key()); cargar(); } }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function resumenTexto(){ const fecha=$('fecha').value; const te=data.entradas.reduce((a,b)=>a+Number(b.valor||0),0); const tg=data.gastos.reduce((a,b)=>a+Number(b.valor||0),0); const ti=data.ingresos.reduce((a,b)=>a+Number(b.valor||0),0); let t=`LIBRETA DIGITAL VDC360\nFecha: ${fecha}\n\nENTRADAS\n`; data.entradas.forEach(x=>t+=`- ${x.nombre}: ${num(x.valor)} kg\n`); t+=`Total entradas: ${num(te)} kg\n\nGASTOS\n`; data.gastos.forEach(x=>t+=`- ${x.nombre}: ${money(x.valor)}\n`); t+=`Total gastos: ${money(tg)}\n\nINGRESOS\n`; data.ingresos.forEach(x=>t+=`- ${x.nombre}: ${money(x.valor)}\n`); t+=`Total ingresos: ${money(ti)}\n\nSaldo inicial: ${money(data.saldoInicial)}\nSaldo actual: ${money(Number(data.saldoInicial||0)+ti-tg)}`; return t; }
function mandarWhatsApp(){ window.open('https://wa.me/?text='+encodeURIComponent(resumenTexto()),'_blank'); }
function exportarCSV(){ let rows=[['Fecha','Tipo','Concepto/Producto','Valor']]; ['entradas','gastos','ingresos'].forEach(k=>data[k].forEach(x=>rows.push([$('fecha').value,k,x.nombre,x.valor]))); rows.push([$('fecha').value,'saldo_inicial','',data.saldoInicial]); const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='libreta_vdc360_'+$('fecha').value+'.csv'; a.click(); }
$('nombre').addEventListener('input', aplicarPesoAzul); $('nombre').addEventListener('change', aplicarPesoAzul);
$('fecha').value=hoy(); $('fecha').addEventListener('change',cargar); $('saldoInicial').addEventListener('input',guardar); document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarModal(); if(e.key==='Enter' && $('modal').classList.contains('show')) guardarMovimiento(); }); cargar();
</script>
</body>
</html>
