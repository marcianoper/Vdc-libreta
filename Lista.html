    .modal{

    .modal.activo{display:flex}

    @media (max-width:520px){

</head>
<body>

            <option value="Pecho">

            <option value="Costilla">
            <option value="Chuleta">
            <option value="Pescuezo">
            <option value="Espaldilla">
            <option value="Diezmillo">
            <option value="Pierna de chorizo">
            <option value="Sebo">
            <option value="Deshebrada">
            <option value="Pierna cocida">
          </datalist>
        </div>

        <div>
          <label for="kilos">Kilos</label>
          <input type="number" id="kilos" inputmode="decimal" step="0.001" min="0" placeholder="0.000">

  <div class="modal" id="modalEditar">
    <div class="modal-caja">
      <h2>Editar renglón</h2>

        <label for="editarProducto">Producto</label>
        <input id="editarProducto" list="catalogoProductos">
      </div>
      <div>
        <label for="editarKilos">Kilos</label>
        <input type="number" id="editarKilos" inputmode="decimal" step="0.001" min="0">
      </div>
      <div class="modal-botones">
        <button class="btn-secundario" id="cancelarEdicion">Cancelar</button>
        <button class="btn-guardar" id="guardarEdicion">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const fecha = document.getElementById('fecha');
    const cliente = document.getElementById('cliente');
    const pesoInicial = document.getElementById('pesoInicial');
    const producto = document.getElementById('producto');
    const kilos = document.getElementById('kilos');
    const lista = document.getElementById('lista');
    const totalKilos = document.getElementById('totalKilos');

    let registros = [];
    let indiceEdicion = null;

    function fechaLocalISO(){
      const ahora = new Date();
      const offset = ahora.getTimezoneOffset();
      return new Date(ahora.getTime() - offset * 60000).toISOString().slice(0,10);
    }

    fecha.value = fechaLocalISO();

    function claveActual(){
      return `despiece_cerdo_vdc360_${fecha.value}`;
    }

    function cargar(){
      const guardado = JSON.parse(localStorage.getItem(claveActual()) || '{}');
      cliente.value = guardado.cliente || '';
      pesoInicial.value = guardado.pesoInicial || '';
      registros = Array.isArray(guardado.registros) ? guardado.registros : [];
      render();
    }

    function guardar(){
      localStorage.setItem(claveActual(), JSON.stringify({
        cliente: cliente.value.trim(),
        pesoInicial: pesoInicial.value,
        registros
      }));
    }

    function formatoKg(valor){
      return Number(valor).toLocaleString('es-MX',{
        minimumFractionDigits:3,
        maximumFractionDigits:3
      }) + ' kg';
    }

    function render(){
      if(registros.length === 0){
        lista.innerHTML = '<div class="vacio">Todavía no hay productos registrados.</div>';
      }else{
        lista.innerHTML = registros.map((r,i)=>`
          <div class="fila">
            <div class="producto">${escapar(r.producto)}</div>
            <div class="peso">${formatoKg(r.kilos)}</div>
            <div class="fila-acciones">
              <button class="icono" onclick="editar(${i})" title="Editar">✏️</button>
              <button class="icono eliminar" onclick="eliminar(${i})" title="Eliminar">🗑️</button>
            </div>
          </div>
        `).join('');
      }

      const total = registros.reduce((s,r)=>s + Number(r.kilos || 0),0);
      totalKilos.textContent = formatoKg(total);
      guardar();
    }

    function escapar(texto){
      return String(texto)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function agregar(){
      const nombre = producto.value.trim();
      const peso = Number(kilos.value);

      if(!nombre){
        producto.focus();
        return;
      }

      if(!Number.isFinite(peso) || peso <= 0){
        kilos.focus();
        return;
      }

      registros.push({
        producto:nombre,
        kilos:peso
      });

      producto.value = '';
      kilos.value = '';
      render();
      producto.focus();
    }

    window.editar = function(i){
      indiceEdicion = i;
      document.getElementById('editarProducto').value = registros[i].producto;
      document.getElementById('editarKilos').value = registros[i].kilos;
      document.getElementById('modalEditar').classList.add('activo');
      setTimeout(()=>document.getElementById('editarProducto').focus(),100);
    }

    window.eliminar = function(i){
      if(confirm('¿Eliminar este renglón?')){
        registros.splice(i,1);
        render();
      }
    }

    document.getElementById('btnAgregar').addEventListener('click', agregar);

    kilos.addEventListener('keydown', e=>{
      if(e.key === 'Enter') agregar();
    });

    producto.addEventListener('keydown', e=>{
      if(e.key === 'Enter') kilos.focus();
    });

    cliente.addEventListener('input', guardar);
    pesoInicial.addEventListener('input', guardar);

    fecha.addEventListener('change', cargar);

    document.getElementById('cancelarEdicion').addEventListener('click', ()=>{
      document.getElementById('modalEditar').classList.remove('activo');
      indiceEdicion = null;
    });

    document.getElementById('guardarEdicion').addEventListener('click', ()=>{
      const nuevoProducto = document.getElementById('editarProducto').value.trim();
      const nuevoPeso = Number(document.getElementById('editarKilos').value);

      if(!nuevoProducto || !Number.isFinite(nuevoPeso) || nuevoPeso <= 0) return;

      registros[indiceEdicion] = {
        producto:nuevoProducto,
        kilos:nuevoPeso
      };

      document.getElementById('modalEditar').classList.remove('activo');
      indiceEdicion = null;
      render();
    });

    document.getElementById('modalEditar').addEventListener('click', e=>{
      if(e.target.id === 'modalEditar'){
        e.currentTarget.classList.remove('activo');
      }
    });

    document.getElementById('btnCSV').addEventListener('click', ()=>{
      if(!registros.length){
        alert('No hay registros para exportar.');
        return;
      }

      const filas = [
        ['Fecha', fecha.value],
        ['Cliente', cliente.value.trim()],
        ['Peso inicial', pesoInicial.value],
        [],
        ['Producto','Kilos'],
        ...registros.map(r=>[r.producto, Number(r.kilos).toFixed(3)]),
        [],
        ['Total', registros.reduce((s,r)=>s+Number(r.kilos),0).toFixed(3)]
      ];

      const csv = filas.map(f=>f.map(v=>`"${String(v ?? '').replaceAll('"','""')}"`).join(',')).join('\n');
      const blob = new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `despiece_${fecha.value}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btnWhatsApp').addEventListener('click', ()=>{
      const total = registros.reduce((s,r)=>s+Number(r.kilos),0);
      const lineas = [
        '*DESPIECE DE CERDO*',
        `Fecha: ${fecha.value}`,
        cliente.value.trim() ? `Cliente: ${cliente.value.trim()}` : '',
        pesoInicial.value ? `Peso inicial: ${Number(pesoInicial.value).toFixed(3)} kg` : '',
        '',
        ...registros.map((r,i)=>`${i+1}. ${r.producto}: ${Number(r.kilos).toFixed(3)} kg`),
        '',
        `*TOTAL: ${total.toFixed(3)} kg*`
      ].filter(Boolean);

      window.open(`https://wa.me/?text=${encodeURIComponent(lineas.join('\n'))}`,'_blank');
    });

    cargar();
  </script>
</body>
</html>
'''

path = Path('/mnt/data/despiece_cerdo_vdc360.html')
path.write_text(html, encoding='utf-8')
print(f'Archivo creado: {path}')
