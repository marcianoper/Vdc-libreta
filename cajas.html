<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Inventario de Cajas VDC360</title>
<style>
:root{--paper:#fbf4df;--paper2:#fff9e9;--ink:#2b2417;--muted:#7d6f55;--line:rgba(80,65,35,.25);--green:#315f42;--red:#8b3434;--blue:#315575;--orange:#a86522;--strong:#3b2d18}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#dccb9e}body{padding:14px}.app{max-width:1280px;margin:0 auto;background:var(--paper);border:2px solid #6f5c35;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden}.header{padding:14px 18px 12px;background:linear-gradient(180deg,var(--paper2),var(--paper));border-bottom:2px solid var(--line)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;letter-spacing:.5px;margin:0;font-weight:900}.dateBox{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}.dateBox input,.search input,.search select{font-size:17px;border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:10px;padding:8px 10px;color:var(--ink);font-weight:800}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tool{border:1px solid var(--line);background:rgba(255,255,255,.25);border-radius:9px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--ink);font-weight:900}.tool:active,.btn:active,.chip:active{transform:scale(.98)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.card{border:1px solid var(--line);background:rgba(255,255,255,.25);border-radius:12px;padding:10px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.5px}.value{font-size:22px;font-weight:900;margin-top:4px}.disp .value{color:var(--green)}.vend .value{color:var(--blue)}.carn .value{color:var(--orange)}
.main{display:grid;grid-template-columns:380px 1fr;min-height:640px}.panel{border-right:2px solid var(--line);padding:16px}.panel h2{margin:0 0 16px;font-size:24px}.field{margin-bottom:13px}.field label{display:block;font-size:14px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.field input,.field select{width:100%;font-size:24px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf4;color:var(--ink);outline:none}.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}.chip{font-size:15px;border:1px solid var(--line);border-radius:999px;padding:8px 10px;background:rgba(255,255,255,.45);cursor:pointer;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:22px;font-weight:900;padding:14px;cursor:pointer;box-shadow:0 5px 12px rgba(0,0,0,.16)}
.content{padding:16px 16px 24px}.search{display:grid;grid-template-columns:1fr 220px 220px;gap:10px;margin-bottom:12px}.tableWrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.2)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid rgba(80,65,35,.16);text-align:left;font-size:15px}th{font-size:13px;text-transform:uppercase;color:var(--muted);font-weight:900;background:rgba(255,255,255,.3)}td{font-weight:800}.num{text-align:right}.state{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:13px;font-weight:900;background:#fffdf4}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.55);font-size:14px;font-weight:900;padding:6px 8px;cursor:pointer}.delete{color:var(--red)}.empty{text-align:center;color:rgba(0,0,0,.38);font-size:18px;font-weight:900;padding:28px!important}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2b2417;color:#fff;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:800;display:none;align-items:center;gap:12px;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:calc(100vw - 24px)}.toast.show{display:flex}.toast button{border:0;background:#fff;color:#2b2417;border-radius:999px;padding:7px 10px;font-weight:900;cursor:pointer}
@media(max-width:900px){body{padding:6px}.summary{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}.panel{border-right:0;border-bottom:2px solid var(--line)}.search{grid-template-columns:1fr}.value{font-size:20px}h1{font-size:22px}th:nth-child(5),td:nth-child(5){display:none}}
@media print{body{background:white;padding:0}.app{box-shadow:none;border:0;border-radius:0}.tools,.panel,.search,.actions{display:none}.main{display:block}.content{padding:0}.tableWrap{border:0}.header{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="topbar">
      <h1>INVENTARIO DE CAJAS VDC360</h1>
      <div class="dateBox">📅 <input type="date" id="fecha"></div>
      <div class="tools">
        <button class="tool" onclick="window.print()">🖨️ Imprimir</button>
        <button class="tool" onclick="exportarCSV()">📄 CSV</button>
        <button class="tool" onclick="mandarWhatsApp()">📱 WhatsApp</button>
        <button class="tool" onclick="limpiarDia()">🧹 Limpiar</button>
      </div>
    </div>
    <div class="summary">
      <div class="card"><div class="label">Cajas registradas</div><div class="value" id="cajasTotal">0</div></div>
      <div class="card"><div class="label">Kilos totales</div><div class="value" id="kgTotal">0.00 kg</div></div>
      <div class="card disp"><div class="label">Disponible</div><div class="value" id="kgDisponible">0.00 kg</div></div>
      <div class="card vend"><div class="label">Vendidas</div><div class="value" id="kgVendida">0.00 kg</div></div>
      <div class="card carn"><div class="label">Carnicería / abiertas</div><div class="value" id="kgCarniceria">0.00 kg</div></div>
    </div>
  </div>
  <div class="main">
    <div class="panel">
      <h2 id="formTitle">Agregar caja</h2>
      <div class="field"><label>Producto</label><input id="producto" autocomplete="off" value="Recorte"></div>
      <div class="quick" id="chips"></div>
      <div class="grid2">
        <div class="field"><label>Peso kg</label><input id="peso" type="number" step="0.01" inputmode="decimal" placeholder="24.50"></div>
        <div class="field"><label>Estado</label><select id="estado"><option>Disponible</option><option>Vendida</option><option>Carnicería</option></select></div>
      </div>
      <div class="field" id="clienteBox"><label>Cliente / destino</label><input id="cliente" autocomplete="off" placeholder="Opcional"></div>
      <button class="btn" id="btnGuardar" onclick="guardarCaja()">＋ AGREGAR CAJA</button>
    </div>
    <div class="content">
      <div class="search">
        <input id="buscar" placeholder="Buscar producto, cliente..." oninput="render()">
        <select id="fEstado" onchange="render()"><option value="">Todos los estados</option><option>Disponible</option><option>Vendida</option><option>Carnicería</option></select>
        <select id="fProducto" onchange="render()"><option value="">Todos los productos</option></select>
      </div>
      <div class="tableWrap"><table><thead><tr><th>#</th><th>Producto</th><th>Peso</th><th>Estado</th><th>Destino / cliente</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" style="display:none">Deshacer</button></div>
<script>
const productosBase=['Recorte','Pierna','Chamorro','Pulpas','Hueso','Costilla','Bola','Diezmillo','Falda','Pecho'];
let data={cajas:[]}; let editando=null; let toastTimer=null;
const $=id=>document.getElementById(id);
function hoy(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function key(){return 'inventario_cajas_vdc360_simple_'+$('fecha').value}
function num(n){return Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function normal(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function cargar(){const raw=localStorage.getItem(key());data=raw?JSON.parse(raw):{cajas:[]};editando=null;resetForm(false);render()}
function guardar(){localStorage.setItem(key(),JSON.stringify(data));render()}
function init(){ $('fecha').value=hoy(); $('chips').innerHTML=productosBase.map(p=>`<button type="button" class="chip" onclick="seleccionarProducto('${p}')">${p}</button>`).join(''); $('fecha').addEventListener('change',cargar); $('estado').addEventListener('change',()=>{$('clienteBox').style.display=$('estado').value==='Disponible'?'none':'block'}); $('peso').addEventListener('keydown',e=>{if(e.key==='Enter')guardarCaja()}); cargar(); }
function seleccionarProducto(p){$('producto').value=p;$('peso').focus()}
function resetForm(limpiarProducto=true){ if(limpiarProducto) $('producto').value=$('producto').value||'Recorte'; $('peso').value=''; $('estado').value='Disponible'; $('cliente').value=''; $('clienteBox').style.display='none'; $('formTitle').textContent='Agregar caja'; $('btnGuardar').textContent='＋ AGREGAR CAJA'; editando=null; }
function guardarCaja(){const producto=$('producto').value.trim(); const peso=Number($('peso').value||0); const estado=$('estado').value; const cliente=$('cliente').value.trim(); if(!producto||!peso){mostrarToast('Falta producto y peso.');return} const obj={producto,peso,estado,cliente,ts:Date.now()}; if(editando!==null){data.cajas[editando]=obj; mostrarToast('Caja actualizada.')}else{data.cajas.push(obj); mostrarToast('Caja agregada.')} guardar(); resetForm(false); $('peso').focus();}
function editar(i){const c=data.cajas[i]; if(!c)return; editando=i; $('producto').value=c.producto; $('peso').value=c.peso; $('estado').value=c.estado; $('cliente').value=c.cliente||''; $('clienteBox').style.display=c.estado==='Disponible'?'none':'block'; $('formTitle').textContent='Editar caja'; $('btnGuardar').textContent='GUARDAR CAMBIO'; window.scrollTo({top:0,behavior:'smooth'});}
function borrar(i){const eliminado=data.cajas[i]; if(!eliminado)return; data.cajas.splice(i,1); guardar(); mostrarToast('Caja eliminada.',()=>{data.cajas.splice(i,0,eliminado);guardar();mostrarToast('Caja restaurada.')});}
function cambiarEstado(i,estado){const c=data.cajas[i]; if(!c)return; c.estado=estado; if(estado==='Disponible') c.cliente=''; guardar(); mostrarToast('Estado actualizado.');}
function filtradas(){const q=normal($('buscar').value); const fe=$('fEstado').value; const fp=$('fProducto').value; return data.cajas.map((c,i)=>({...c,_i:i})).filter(c=>(!q||normal(c.producto+' '+(c.cliente||'')).includes(q))&&(!fe||c.estado===fe)&&(!fp||c.producto===fp));}
function render(){const total=data.cajas.reduce((a,c)=>a+Number(c.peso||0),0); const disp=data.cajas.filter(c=>c.estado==='Disponible').reduce((a,c)=>a+Number(c.peso||0),0); const ven=data.cajas.filter(c=>c.estado==='Vendida').reduce((a,c)=>a+Number(c.peso||0),0); const car=data.cajas.filter(c=>c.estado==='Carnicería').reduce((a,c)=>a+Number(c.peso||0),0); $('cajasTotal').textContent=data.cajas.length; $('kgTotal').textContent=num(total)+' kg'; $('kgDisponible').textContent=num(disp)+' kg'; $('kgVendida').textContent=num(ven)+' kg'; $('kgCarniceria').textContent=num(car)+' kg'; const prods=[...new Set(data.cajas.map(c=>c.producto).filter(Boolean))].sort(); $('fProducto').innerHTML='<option value="">Todos los productos</option>'+prods.map(p=>`<option ${$('fProducto').value===p?'selected':''}>${escapeHtml(p)}</option>`).join(''); const arr=filtradas(); const tb=$('tbody'); if(!arr.length){tb.innerHTML='<tr><td colspan="6" class="empty">No hay cajas registradas con estos filtros.</td></tr>';return} tb.innerHTML=arr.map((c,idx)=>`<tr><td>${idx+1}</td><td>${escapeHtml(c.producto)}</td><td class="num">${num(c.peso)} kg</td><td><select class="state" onchange="cambiarEstado(${c._i},this.value)"><option ${c.estado==='Disponible'?'selected':''}>Disponible</option><option ${c.estado==='Vendida'?'selected':''}>Vendida</option><option ${c.estado==='Carnicería'?'selected':''}>Carnicería</option></select></td><td>${escapeHtml(c.cliente||'-')}</td><td><div class="actions"><button class="mini" onclick="editar(${c._i})">Editar</button><button class="mini delete" onclick="borrar(${c._i})">Eliminar</button></div></td></tr>`).join('');}

function resumenTexto(){
 const numf=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
 let t=`📦 INVENTARIO DE CAJAS VDC360\nFecha: ${$('fecha').value}\n`;
 const totalKg=data.cajas.reduce((a,c)=>a+Number(c.peso||0),0);
 const disp=data.cajas.filter(c=>c.estado==='Disponible');
 const ven=data.cajas.filter(c=>c.estado==='Vendida');
 const car=data.cajas.filter(c=>c.estado==='Carnicería');
 t+=`\n════ RESUMEN GENERAL ════\n`;
 t+=`Cajas registradas: ${data.cajas.length}\n`;
 t+=`Kilos totales: ${numf(totalKg)} kg\n`;
 t+=`Disponibles: ${disp.length} cajas / ${numf(disp.reduce((a,c)=>a+c.peso,0))} kg\n`;
 t+=`Vendidas: ${ven.length} cajas / ${numf(ven.reduce((a,c)=>a+c.peso,0))} kg\n`;
 const porProd={};
 data.cajas.forEach(c=>{porProd[c.producto]=porProd[c.producto]||{c:0,kg:0};porProd[c.producto].c++;porProd[c.producto].kg+=Number(c.peso||0);});
 t+=`\n════ RESUMEN POR PRODUCTO ════\n`;
 Object.keys(porProd).sort().forEach(p=>t+=`• ${p}: ${porProd[p].c} cajas / ${numf(porProd[p].kg)} kg\n`);
 const grupos={};
 ven.forEach(c=>{const cli=c.cliente||'Sin cliente';(grupos[cli]??=[]).push(c);});
 Object.keys(grupos).sort().forEach(cli=>{
   t+=`\n════ VENTA - ${cli.toUpperCase()} ════\n`;
   const by={};
   grupos[cli].forEach(c=>(by[c.producto]??=[]).push(c));
   Object.keys(by).sort().forEach(prod=>{
      const arr=by[prod];
      t+=`\n${prod.toUpperCase()}\n`;
      arr.forEach((c,i)=>t+=`${i+1}. ${numf(c.peso)} kg\n`);
      const kg=arr.reduce((a,c)=>a+c.peso,0);
      t+=`Subtotal: ${arr.length} cajas / ${numf(kg)} kg\n`;
   });
 });
 t+=`\n════ INVENTARIO DISPONIBLE ════\n`;
 const byd={};
 disp.forEach(c=>(byd[c.producto]??=[]).push(c));
 Object.keys(byd).sort().forEach(prod=>{
   const arr=byd[prod];
   t+=`\n${prod.toUpperCase()}\n`;
   arr.forEach((c,i)=>t+=`${i+1}. ${numf(c.peso)} kg\n`);
   const kg=arr.reduce((a,c)=>a+c.peso,0);
   t+=`Subtotal: ${arr.length} cajas / ${numf(kg)} kg\n`;
 });
 return t;
}
function mandarWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(resumenTexto()),'_blank')}
function exportarCSV(){let rows=[['Fecha','Producto','Peso kg','Estado','Cliente/Destino']];data.cajas.forEach(c=>rows.push([$('fecha').value,c.producto,c.peso,c.estado,c.cliente||'']));const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inventario_cajas_'+$('fecha').value+'.csv';a.click()}
function limpiarDia(){const respaldo=JSON.stringify(data);localStorage.removeItem(key());cargar();mostrarToast('Inventario limpiado.',()=>{data=JSON.parse(respaldo);guardar();mostrarToast('Inventario restaurado.')})}
function mostrarToast(msg,undoFn=null){clearTimeout(toastTimer);$('toastMsg').textContent=msg;const btn=$('toastUndo');if(undoFn){btn.style.display='inline-block';btn.onclick=()=>{undoFn();ocultarToast()}}else{btn.style.display='none';btn.onclick=null}$('toast').classList.add('show');toastTimer=setTimeout(ocultarToast,3500)}function ocultarToast(){$('toast').classList.remove('show')}function escapeHtml(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
init();
</script>
</body>
</html>
