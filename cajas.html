<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Inventario de Cajas VDC360</title>
<style>
:root{
  --paper:#fbf4df;
  --paper-2:#fff9e9;
  --ink:#2b2417;
  --muted:#7d6f55;
  --line:rgba(80,65,35,.25);
  --strong:#3b2d18;
  --green:#315f42;
  --red:#8b3434;
  --blue:#315575;
  --orange:#a86522;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#dccb9e}
body{padding:14px}.app{max-width:1280px;margin:0 auto;background:var(--paper);border:2px solid #6f5c35;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden}.header{padding:14px 18px 12px;background:linear-gradient(180deg,var(--paper-2),var(--paper));border-bottom:2px solid var(--line)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;letter-spacing:.5px;margin:0;font-weight:900}.dateBox{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}.dateBox input{font-size:17px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 8px;color:var(--ink);font-weight:800}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tool{border:1px solid var(--line);background:rgba(255,255,255,.25);border-radius:9px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--ink);font-weight:800}.tool:active,.btn:active{transform:scale(.98)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.card{border:1px solid var(--line);background:rgba(255,255,255,.25);border-radius:12px;padding:10px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.5px}.value{font-size:22px;font-weight:900;margin-top:4px}.card.disp .value{color:var(--green)}.card.uso .value{color:var(--orange)}.card.vend .value{color:var(--blue)}.card.total .value{color:var(--strong)}
.main{display:grid;grid-template-columns:390px 1fr;gap:0}.panel{border-right:2px solid var(--line);padding:14px;background:rgba(255,255,255,.16)}.panel h2{margin:0 0 12px;font-size:22px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;font-size:20px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fffdf4;color:var(--ink);outline:none}.field textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:14px;padding:13px 10px;font-size:18px;font-weight:900;cursor:pointer;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.16)}.btn.add{background:var(--green)}.btn.clear{background:var(--red)}.btn.secondary{background:var(--blue)}.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:7px 9px;background:rgba(255,255,255,.4);cursor:pointer;font-weight:800}.content{padding:14px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.filters input,.filters select{font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fffdf4}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.2)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 8px;border-bottom:1px solid rgba(80,65,35,.16);text-align:left;font-size:15px}th{position:sticky;top:0;background:var(--paper-2);font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:900;z-index:1}td.peso{text-align:right;font-weight:900}.status{display:inline-block;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900}.status.disponible{background:rgba(49,95,66,.16);color:var(--green)}.status.vendida{background:rgba(49,85,117,.16);color:var(--blue)}.status.abierta{background:rgba(168,101,34,.18);color:var(--orange)}.status.merma{background:rgba(139,52,52,.16);color:var(--red)}.rowBtns{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:900;cursor:pointer}.mini.del{color:var(--red)}.mini.use{color:var(--orange)}.mini.sell{color:var(--blue)}.empty{text-align:center;padding:22px;color:rgba(0,0,0,.38);font-weight:800}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2b2417;color:#fff;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:800;display:none;align-items:center;gap:12px;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:calc(100vw - 24px)}.toast.show{display:flex}.toast button{border:0;background:#fff;color:#2b2417;border-radius:999px;padding:7px 10px;font-weight:900;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{width:min(470px,100%);background:var(--paper-2);border:2px solid #6f5c35;border-radius:16px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.actions button{font-size:17px;font-weight:900;border-radius:12px;padding:10px 14px;border:1px solid var(--line);cursor:pointer}.save{background:var(--strong);color:white}.cancel{background:transparent;color:var(--ink)}
@media(max-width:920px){body{padding:6px}.summary{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}.panel{border-right:0;border-bottom:2px solid var(--line)}h1{font-size:21px}.value{font-size:19px}.filters{grid-template-columns:1fr}.tool{font-size:14px}.field input,.field select,.field textarea{font-size:19px}}
@media print{body{background:white;padding:0}.app{box-shadow:none;border:0;border-radius:0}.tools,.panel,.filters,.rowBtns,.toast,.modal{display:none!important}.main{display:block}.content{padding:0}.summary{grid-template-columns:repeat(5,1fr)}table{min-width:0}th{position:static}.tableWrap{border:0}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="topbar">
      <h1>INVENTARIO DE CAJAS VDC360</h1>
      <div class="dateBox">📅 <input type="date" id="fecha"></div>
      <div class="tools">
        <button class="tool" onclick="window.print()">🖨️ Imprimir</button>
        <button class="tool" onclick="exportarCSV()">📄 CSV</button>
        <button class="tool" onclick="mandarWhatsApp()">📱 WhatsApp</button>
      </div>
    </div>
    <div class="summary">
      <div class="card total"><div class="label">Cajas registradas</div><div class="value" id="totalCajas">0</div></div>
      <div class="card total"><div class="label">Kilos totales</div><div class="value" id="totalKilos">0.00 kg</div></div>
      <div class="card disp"><div class="label">Disponible</div><div class="value" id="kilosDisponibles">0.00 kg</div></div>
      <div class="card vend"><div class="label">Vendidas</div><div class="value" id="kilosVendidos">0.00 kg</div></div>
      <div class="card uso"><div class="label">Carnicería/abiertas</div><div class="value" id="kilosAbiertos">0.00 kg</div></div>
    </div>
  </div>

  <div class="main">
    <aside class="panel">
      <h2>Agregar caja</h2>
      <div class="field"><label>Producto</label><input id="producto" list="productosLista" autocomplete="off" placeholder="Ej. Recorte"></div>
      <datalist id="productosLista"></datalist>
      <div class="quick" id="chips"></div>
      <div class="grid2">
        <div class="field"><label>Peso kg</label><input id="peso" type="number" step="0.01" inputmode="decimal" pattern="[0-9]*" placeholder="24.50"></div>
        <div class="field"><label>Etiqueta/Folio</label><input id="etiqueta" autocomplete="off" placeholder="Opcional"></div>
      </div>
      <div class="field"><label>Proveedor / lote</label><input id="lote" autocomplete="off" placeholder="Opcional"></div>
      <div class="field"><label>Notas</label><textarea id="notas" placeholder="Opcional"></textarea></div>
      <button class="btn add" onclick="agregarCaja()">＋ AGREGAR CAJA</button>
      <div class="grid2" style="margin-top:10px">
        <button class="btn secondary" onclick="duplicarUltima()">Duplicar última</button>
        <button class="btn clear" onclick="limpiarDia()">Limpiar día</button>
      </div>
    </aside>

    <section class="content">
      <div class="filters">
        <input id="buscar" placeholder="Buscar producto, etiqueta, cliente..." oninput="render()">
        <select id="filtroEstado" onchange="render()">
          <option value="todos">Todos los estados</option>
          <option value="disponible">Disponible</option>
          <option value="vendida">Vendida</option>
          <option value="abierta">Abierta para carnicería</option>
          <option value="merma">Merma / ajuste</option>
        </select>
        <select id="filtroProducto" onchange="render()"><option value="todos">Todos los productos</option></select>
      </div>
      <div class="tableWrap">
        <table>
          <thead><tr><th>#</th><th>Producto</th><th>Etiqueta</th><th>Peso</th><th>Estado</th><th>Destino / cliente</th><th>Notas</th><th>Acciones</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<div class="modal" id="modalUso" onclick="cerrarModalFondo(event)">
  <div class="box">
    <h2 id="usoTitulo">Marcar caja</h2>
    <div class="field"><label>Destino / cliente</label><input id="usoDestino" autocomplete="off" placeholder="Ej. Cliente Juan / Carnicería"></div>
    <div class="field"><label>Nota</label><textarea id="usoNota" placeholder="Opcional"></textarea></div>
    <div class="actions"><button class="cancel" onclick="cerrarModalUso()">Cancelar</button><button class="save" onclick="guardarUso()">Guardar</button></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" style="display:none">Deshacer</button></div>

<script>
const productosBase=['Recorte','Pierna','Chamorro','Pulpas','Hueso','Costilla','Bola','Diezmillo','Falda','Pecho','Molida','Cuero','Panza','Menudo','Tripa','Lengua','Cabeza'];
let data={cajas:[]};
let ultimoAgregado=null;
let ultimoBorrado=null;
let toastTimer=null;
let usoActual=null;
const $=id=>document.getElementById(id);
function hoy(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function key(){return 'inventario_cajas_vdc360_v1_'+$('fecha').value}
function num(n){return Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function escapeHtml(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function normalizar(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function cargar(){const raw=localStorage.getItem(key());data=raw?JSON.parse(raw):{cajas:[]};render();}
function guardar(){localStorage.setItem(key(),JSON.stringify(data));render();}
function mostrarToast(msg,undoFn=null){clearTimeout(toastTimer);$('toastMsg').textContent=msg;const btn=$('toastUndo');if(undoFn){btn.style.display='inline-block';btn.onclick=()=>{undoFn();ocultarToast()}}else{btn.style.display='none';btn.onclick=null}$('toast').classList.add('show');toastTimer=setTimeout(ocultarToast,3500)}
function ocultarToast(){$('toast').classList.remove('show')}
function initProductos(){ $('productosLista').innerHTML=productosBase.map(x=>`<option value="${escapeHtml(x)}">`).join(''); $('chips').innerHTML=productosBase.slice(0,10).map(x=>`<button type="button" class="chip" onclick="seleccionarProducto('${escapeHtml(x)}')">${escapeHtml(x)}</button>`).join(''); }
function seleccionarProducto(p){$('producto').value=p;$('peso').focus()}
function productosUnicos(){return [...new Set([...productosBase,...data.cajas.map(c=>c.producto).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'es'))}
function actualizarFiltroProducto(){const actual=$('filtroProducto').value;const opts=['<option value="todos">Todos los productos</option>'].concat(productosUnicos().map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`));$('filtroProducto').innerHTML=opts.join('');$('filtroProducto').value=productosUnicos().includes(actual)?actual:'todos'}
function cajaVisible(c){const q=normalizar($('buscar').value);const estado=$('filtroEstado').value;const prod=$('filtroProducto').value;if(estado!=='todos'&&c.estado!==estado)return false;if(prod!=='todos'&&c.producto!==prod)return false;if(!q)return true;return normalizar([c.producto,c.etiqueta,c.lote,c.destino,c.notas,c.usoNota].join(' ')).includes(q)}
function render(){actualizarFiltroProducto();const cajas=data.cajas||[];const visibles=cajas.filter(cajaVisible);const totalKg=cajas.reduce((a,b)=>a+Number(b.peso||0),0);const disp=cajas.filter(c=>c.estado==='disponible').reduce((a,b)=>a+Number(b.peso||0),0);const vend=cajas.filter(c=>c.estado==='vendida').reduce((a,b)=>a+Number(b.peso||0),0);const ab=cajas.filter(c=>c.estado==='abierta').reduce((a,b)=>a+Number(b.peso||0),0);$('totalCajas').textContent=cajas.length;$('totalKilos').textContent=num(totalKg)+' kg';$('kilosDisponibles').textContent=num(disp)+' kg';$('kilosVendidos').textContent=num(vend)+' kg';$('kilosAbiertos').textContent=num(ab)+' kg';const tb=$('tbody');tb.innerHTML='';if(!visibles.length){tb.innerHTML='<tr><td colspan="8" class="empty">No hay cajas registradas con estos filtros.</td></tr>';return}visibles.forEach((c)=>{const idx=cajas.indexOf(c);const tr=document.createElement('tr');tr.innerHTML=`<td>${idx+1}</td><td><b>${escapeHtml(c.producto)}</b><br><small>${escapeHtml(c.lote||'')}</small></td><td>${escapeHtml(c.etiqueta||'-')}</td><td class="peso">${num(c.peso)} kg</td><td><span class="status ${c.estado}">${textoEstado(c.estado)}</span></td><td>${escapeHtml(c.destino||'-')}</td><td>${escapeHtml([c.notas,c.usoNota].filter(Boolean).join(' / ')||'-')}</td><td><div class="rowBtns"><button class="mini sell" onclick="abrirUso(${idx},'vendida')">Vender</button><button class="mini use" onclick="abrirUso(${idx},'abierta')">Carnicería</button><button class="mini" onclick="abrirUso(${idx},'merma')">Merma</button><button class="mini" onclick="volverDisponible(${idx})">Disponible</button><button class="mini del" onclick="borrarCaja(${idx})">×</button></div></td>`;tb.appendChild(tr)})}
function textoEstado(e){return {disponible:'Disponible',vendida:'Vendida',abierta:'Carnicería',merma:'Merma'}[e]||e}
function agregarCaja(){const producto=$('producto').value.trim();const peso=Number($('peso').value||0);if(!producto||!peso){mostrarToast('Falta producto y peso.');return}const caja={id:Date.now()+Math.random(),producto,peso,etiqueta:$('etiqueta').value.trim(),lote:$('lote').value.trim(),notas:$('notas').value.trim(),estado:'disponible',destino:'',usoNota:'',creada:new Date().toISOString()};data.cajas.push(caja);ultimoAgregado=caja;guardar();$('peso').value='';$('etiqueta').value='';$('notas').value='';mostrarToast('Caja agregada.');}
function duplicarUltima(){const base=ultimoAgregado||data.cajas[data.cajas.length-1];if(!base){mostrarToast('No hay caja para duplicar.');return}$('producto').value=base.producto;$('peso').value=base.peso;$('lote').value=base.lote||'';$('etiqueta').value='';$('notas').value=base.notas||'';mostrarToast('Datos listos para duplicar. Cambia etiqueta si aplica.');}
function abrirUso(idx,estado){usoActual={idx,estado};$('usoTitulo').textContent=estado==='vendida'?'Marcar como vendida':estado==='abierta'?'Abrir para carnicería':'Marcar merma / ajuste';const c=data.cajas[idx];$('usoDestino').value=c.destino||'';$('usoNota').value=c.usoNota||'';$('modalUso').classList.add('show')}
function cerrarModalUso(){$('modalUso').classList.remove('show');usoActual=null}
function cerrarModalFondo(e){if(e.target.id==='modalUso')cerrarModalUso()}
function guardarUso(){if(!usoActual)return;const c=data.cajas[usoActual.idx];if(!c)return;c.estado=usoActual.estado;c.destino=$('usoDestino').value.trim();c.usoNota=$('usoNota').value.trim();guardar();cerrarModalUso();mostrarToast('Estado actualizado.');}
function volverDisponible(idx){const c=data.cajas[idx];if(!c)return;const anterior={...c};c.estado='disponible';c.destino='';c.usoNota='';guardar();mostrarToast('Caja marcada disponible.',()=>{data.cajas[idx]=anterior;guardar();mostrarToast('Cambio deshecho.')})}
function borrarCaja(idx){const borrada=data.cajas[idx];if(!borrada)return;data.cajas.splice(idx,1);guardar();mostrarToast('Caja eliminada.',()=>{data.cajas.splice(idx,0,borrada);guardar();mostrarToast('Caja restaurada.')})}
function limpiarDia(){const respaldo=JSON.stringify(data);data={cajas:[]};guardar();mostrarToast('Inventario del día limpiado.',()=>{data=JSON.parse(respaldo);guardar();mostrarToast('Inventario restaurado.')})}
function resumenPorProducto(cajas){const map={};cajas.forEach(c=>{if(!map[c.producto])map[c.producto]={cajas:0,kg:0};map[c.producto].cajas++;map[c.producto].kg+=Number(c.peso||0)});return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([p,v])=>`- ${p}: ${v.cajas} cajas / ${num(v.kg)} kg`).join('\n')||'- Sin registros'}
function resumenTexto(){const fecha=$('fecha').value;const cajas=data.cajas||[];const disp=cajas.filter(c=>c.estado==='disponible');const vend=cajas.filter(c=>c.estado==='vendida');const ab=cajas.filter(c=>c.estado==='abierta');const mer=cajas.filter(c=>c.estado==='merma');let t=`INVENTARIO DE CAJAS VDC360\nFecha: ${fecha}\n\nRESUMEN GENERAL\nCajas registradas: ${cajas.length}\nKilos totales: ${num(cajas.reduce((a,b)=>a+Number(b.peso||0),0))} kg\nDisponible: ${num(disp.reduce((a,b)=>a+Number(b.peso||0),0))} kg\nVendidas: ${num(vend.reduce((a,b)=>a+Number(b.peso||0),0))} kg\nCarnicería/abiertas: ${num(ab.reduce((a,b)=>a+Number(b.peso||0),0))} kg\nMerma/ajuste: ${num(mer.reduce((a,b)=>a+Number(b.peso||0),0))} kg\n\nRESUMEN POR PRODUCTO\n${resumenPorProducto(cajas)}\n\nDETALLE DE CAJAS\n`;cajas.forEach((c,i)=>{t+=`${i+1}. ${c.producto} | ${num(c.peso)} kg | Etiq: ${c.etiqueta||'-'} | ${textoEstado(c.estado)} | ${c.destino||'-'}\n`});return t}
function mandarWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(resumenTexto()),'_blank')}
function exportarCSV(){let rows=[['Fecha','Producto','Peso kg','Etiqueta','Proveedor/Lote','Estado','Destino/Cliente','Notas','Nota uso']];(data.cajas||[]).forEach(c=>rows.push([$('fecha').value,c.producto,c.peso,c.etiqueta,c.lote,textoEstado(c.estado),c.destino,c.notas,c.usoNota]));const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inventario_cajas_vdc360_'+$('fecha').value+'.csv';a.click()}
$('fecha').value=hoy();$('fecha').addEventListener('change',cargar);document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModalUso();});initProductos();cargar();
</script>
</body>
</html>
